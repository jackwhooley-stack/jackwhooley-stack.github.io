<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jack Whooley</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #000;
        }

        h1 a {
            color: #000;
            text-decoration: none;
        }

        nav {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin-right: 15px;
            font-size: 0.95rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav span {
            color: #999;
            margin: 0 5px;
        }

        main {
            margin-bottom: 60px;
        }

        p {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #333;
        }

        footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: #666;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 5px;
            color: #000;
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 15px;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
                position: relative;
                flex-wrap: wrap;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 0;
            }

            .menu-toggle {
                display: block;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #e0e0e0;
            }

            nav.open {
                display: flex;
            }

            nav a {
                display: block;
                padding: 12px 0;
                margin-right: 0;
                font-size: 1.05rem;
                border-bottom: 1px solid #f5f5f5;
            }

            nav a:last-child {
                border-bottom: none;
            }

            nav span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">Jack Whooley</a></h1>
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">☰</button>
        <nav id="site-nav">
            <a href="index.html">home</a>
            <span>·</span>
            <a href="about.html">about</a>
            <span>·</span>
            <a href="projects.html">projects</a>
            <span>·</span>
            <a href="mathematics.html">mathematics</a>
            <span>·</span>
            <a href="languages.html">languages</a>
            <span>·</span>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <main>
        <p>jack dot whooley at gmail dot com</p>
    </main>

    <footer>
        © 2026 Jack Whooley. All rights reserved.
    </footer>
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function () {
            document.getElementById('site-nav').classList.toggle('open');
        });
    </script>
</body>
</html>
